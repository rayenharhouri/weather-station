# WeatherHub Mosquitto broker — dev configuration.
#
# Before production: set `allow_anonymous false`, provision a passwd file
# (mosquitto_passwd -c /mosquitto/config/passwd <user>), enable TLS, and add
# ACLs so each device can only publish to tenants/{its-tid}/stations/{its-sid}/#.

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

# MQTT over TCP — for ESP32 and the NestJS ingest worker.
listener 1883
protocol mqtt
allow_anonymous true

# MQTT over WebSocket — useful for browser-based admin tools.
listener 9001
protocol websockets
allow_anonymous true
