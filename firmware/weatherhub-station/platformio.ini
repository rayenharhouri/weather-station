; PlatformIO project — WeatherHub ESP32 station.
;
; Two build envs:
;
;   [env:esp32dev]  — full firmware. Reads BME280 + BH1750, joins WiFi,
;                     publishes over MQTT. Needs src/config.h filled in
;                     before it'll build.
;
;   [env:splash]    — pre-sensor placeholder. Drives only the onboard OLED
;                     of the HiLetgo ESP32 OLED Kit (Heltec WiFi Kit 32),
;                     shows a Japanese "近日公開 / COMING SOON" card. No
;                     WiFi, no I²C sensors, no config.h required. Flash
;                     this while you wait for the sensors to ship.
;
;     pio run -e splash -t upload     # builds + flashes the OLED splash
;     pio run -e esp32dev -t upload   # builds + flashes the full firmware

; ─── Full firmware (default) ───────────────────────────────────────
; Target: ESP32-S3 (Heltec WiFi Kit 32 V3 / HiLetgo OLED Kit V3 silicon).
; If you somehow have the older classic-ESP32 variant, swap `board` to
; `esp32dev` and revert the OLED pins in splash.cpp.
[env:esp32dev]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_src_filter = +<main.cpp>

build_flags =
    -DCORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_INFO

lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.1.0
    adafruit/Adafruit BME280 Library @ ^2.2.4
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    claws/BH1750 @ ^1.3.0
    olikraus/U8g2 @ ^2.35.19

; ─── OLED splash (pre-sensor placeholder) ──────────────────────────
[env:splash]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_src_filter = +<splash.cpp>

lib_deps =
    olikraus/U8g2 @ ^2.35.19

; ─── Sensor sanity check (no WiFi, no MQTT) ────────────────────────
; Boots OLED + scans the external I²C bus (GPIO 41/42 / Wire1) + probes
; BME280 + BH1750 + GPIO 5 rain switch. Live status grid on the OLED,
; verbose dump to Serial at 115200. Flash this BEFORE attempting the
; full firmware — it'll tell you exactly which sensor (if any) isn't
; talking to the MCU.
;
; NB: Heltec WiFi Kit 32 V3 routes its USB-C through a CP2102 to UART0.
; The ESP32-S3's native USB peripheral is NOT exposed on this board, so
; `ARDUINO_USB_CDC_ON_BOOT` must stay OFF — otherwise `Serial.print()`
; goes to the unconnected native USB and the monitor sees nothing past
; the bootloader banner.
[env:sanity]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_src_filter = +<sanity.cpp>

lib_deps =
    olikraus/U8g2 @ ^2.35.19
    adafruit/Adafruit BME280 Library @ ^2.2.4
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    claws/BH1750 @ ^1.3.0

; ─── BME280 standalone test (no OLED, no BH1750, no rain gauge) ────
; Isolates just the BME280 on the external sensor bus so a failure can
; only mean wiring / address strap / a dead sensor. Same USB-CDC caveat
; as [env:sanity] applies (Heltec V3 has no native USB — leave
; ARDUINO_USB_CDC_ON_BOOT off, which is the default here).
[env:bme-test]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_src_filter = +<bme-test.cpp>

lib_deps =
    adafruit/Adafruit BME280 Library @ ^2.2.4
    adafruit/Adafruit Unified Sensor @ ^1.1.14

; ─── BME280 + BH1750 combined test (no OLED, no rain gauge) ────────
; Adds the lux sensor onto the BME280 test's bus. Same USB-CDC caveat
; as [env:sanity] applies (Heltec V3 has no native USB — leave
; ARDUINO_USB_CDC_ON_BOOT off, which is the default here).
[env:bme-bh1750-test]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_src_filter = +<bme-bh1750-test.cpp>

lib_deps =
    adafruit/Adafruit BME280 Library @ ^2.2.4
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    claws/BH1750 @ ^1.3.0

; ─── ESP32-S3 alt-board ─────────────────────────────────────────────
; Uncomment this block + comment out the [env:esp32dev] block above to
; target an ESP32-S3-DevKitC-1.
;
; [env:esp32s3dev]
; platform = espressif32
; board = esp32-s3-devkitc-1
; framework = arduino
; monitor_speed = 115200
; upload_speed = 921600
; lib_deps =
;     knolleary/PubSubClient @ ^2.8
;     bblanchon/ArduinoJson @ ^7.1.0
;     adafruit/Adafruit BME280 Library @ ^2.2.4
;     adafruit/Adafruit Unified Sensor @ ^1.1.14
;     claws/BH1750 @ ^1.3.0
